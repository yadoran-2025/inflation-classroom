<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>중앙은행 활동 시안</title>
    <style>
      @font-face {
        font-family: "sd-misaeng";
        src: url("./fonts/sdmisaeng.woff2") format("woff2");
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #fffdf7;
        color: #1f1f1d;
        font-family: "sd-misaeng", system-ui, sans-serif;
        word-break: keep-all;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }

      .card {
        width: min(100%, 760px);
        border: 3px solid #1f1f1d;
        border-radius: 18px 14px 20px 13px;
        background: #fffefa;
        box-shadow: 6px 7px 0 #1f1f1d;
        padding: clamp(20px, 4vw, 34px);
      }

      .tag {
        display: inline-flex;
        border: 2px solid #1f1f1d;
        border-radius: 999px;
        background: #fff3b0;
        padding: 6px 14px;
        font-size: clamp(24px, 5vw, 32px);
        font-weight: 900;
      }

      h1 {
        margin: 14px 0 10px;
        text-align: center;
        font-size: clamp(42px, 9vw, 68px);
        line-height: 0.98;
      }

      .scenario {
        margin-top: 18px;
        border: 2px solid #1f1f1d;
        border-radius: 14px 11px 16px 12px;
        background: white;
        padding: 18px;
        font-size: clamp(27px, 5.6vw, 34px);
        line-height: 1.35;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 16px;
      }

      .stat {
        border: 2px solid #1f1f1d;
        border-radius: 13px;
        background: #dff4ff;
        padding: 12px;
        text-align: center;
      }

      .stat strong {
        display: block;
        font-size: clamp(38px, 8vw, 58px);
        line-height: 0.95;
      }

      .choices {
        display: grid;
        gap: 12px;
        margin-top: 18px;
      }

      button {
        border: 2px solid #1f1f1d;
        border-radius: 13px 10px 15px 11px;
        background: white;
        padding: 14px;
        color: inherit;
        font: inherit;
        font-size: clamp(28px, 5.6vw, 36px);
        font-weight: 900;
        cursor: pointer;
        box-shadow: 3px 4px 0 #1f1f1d;
      }

      button:hover,
      button.is-selected {
        background: #d9f6d3;
        transform: translate(-1px, -2px) rotate(-0.3deg);
      }

      .result {
        margin-top: 18px;
        border: 2px solid #1f1f1d;
        border-radius: 14px;
        background: #fff3b0;
        padding: 16px;
        font-size: clamp(27px, 5.6vw, 34px);
        line-height: 1.35;
      }

      .groups {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }

      .group {
        border: 2px solid #1f1f1d;
        border-radius: 12px;
        background: white;
        padding: 10px 12px;
      }

      textarea {
        width: 100%;
        min-height: 96px;
        margin-top: 12px;
        border: 2px solid #1f1f1d;
        border-radius: 12px;
        padding: 12px;
        font: inherit;
        font-size: clamp(27px, 5.6vw, 34px);
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <span class="tag">ACTIVITY: 중앙은행장 회의</span>
        <h1>무엇을 포기할 것인가?</h1>

        <div class="scenario">
          물가는 빠르게 오르고 있습니다. 그런데 자영업자와 기업은 이미 대출 이자 때문에 힘들다고 말합니다.
          <div class="stats">
            <div class="stat">물가상승률 <strong>7.2%</strong></div>
            <div class="stat">실업률 <strong>4.8%</strong></div>
          </div>
        </div>

        <div class="choices">
          <button data-result="물가를 누르는 선택입니다. 하지만 대출 이자 부담이 커져 투자와 채용이 줄 수 있습니다.">금리 인상</button>
          <button data-result="충격을 줄이는 선택입니다. 하지만 사람들이 '물가는 계속 오르겠구나'라고 믿기 시작할 수 있습니다.">유지</button>
          <button data-result="일자리와 투자를 돕는 선택입니다. 하지만 시중에 돈이 더 풀려 물가가 더 뛸 수 있습니다.">금리 인하</button>
        </div>

        <div class="result" id="result">
          선택하면, 누가 웃고 누가 우는지 공개됩니다.
        </div>

        <div class="groups">
          <div class="group">소비자: 장바구니 물가가 중요하다.</div>
          <div class="group">기업: 대출 이자와 투자 계획이 중요하다.</div>
          <div class="group">구직자: 채용이 줄어드는지가 중요하다.</div>
        </div>

        <textarea placeholder="당신의 선택을 한 문장으로 방어해보세요."></textarea>
      </section>
    </main>

    <script>
      const result = document.querySelector("#result");
      document.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll("button").forEach((item) => item.classList.remove("is-selected"));
          button.classList.add("is-selected");
          result.textContent = button.dataset.result;
        });
      });
    </script>
  </body>
</html>
